<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onslaught Logbook</title>
<meta name="description" content="Workout logbook for weeks 5–12 of John Meadows’ Onslaught.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EDEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1012" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Onslaught">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>
<div id="restbar" class="restbar" hidden></div>
<nav id="tabs" class="tabs" aria-label="Sections"></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="update" class="toast update" role="status" hidden></div>
<noscript>Onslaught Logbook needs JavaScript.</noscript>
<script>window.__PLATFORM__ = 'pwa';</script>
<script src="app.js"></script>
</body>
</html>
